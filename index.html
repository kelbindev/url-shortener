<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL Shortener - Kelbin's Portfolio</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --steam-blue: #1b2838;
            --steam-dark-blue: #171a21;
            --steam-darkest: #0e1419;
            --steam-light-blue: #2a475e;
            --steam-highlight: #66c0f4;
            --steam-accent: #5ba3d0;
            --steam-text: #c7d5e0;
            --steam-text-dark: #8f98a0;
            --steam-border: #3d4450;
            --steam-hover: #417a9b;
            --glow-blue: rgba(102, 192, 244, 0.3);
            --glow-blue-strong: rgba(102, 192, 244, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background:
                linear-gradient(135deg, rgba(10, 14, 39, 0.98) 0%, rgba(26, 31, 58, 0.98) 25%, rgba(27, 40, 56, 0.98) 50%, rgba(15, 20, 25, 0.98) 100%);
            background-color: var(--steam-darkest);
            color: var(--steam-text);
            font-family: "Segoe UI", "Motiva Sans", Arial, Helvetica, sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 20% 30%, rgba(102, 192, 244, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(91, 163, 208, 0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Page layout */
        .page-wrapper {
            position: relative;
            z-index: 1;
            padding: 2.5rem 1rem;
        }

        .main-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .page-header h1 {
            color: var(--steam-text);
            font-weight: 700;
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 20px var(--glow-blue);
        }

        .page-header h1 i {
            color: var(--steam-highlight);
        }

        .page-header p {
            color: var(--steam-text-dark);
            font-size: 1rem;
        }

        /* Card */
        .main-card {
            background: rgba(42, 71, 94, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid var(--steam-border);
            border-radius: 8px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(102, 192, 244, 0.05);
        }

        /* Form */
        .form-label {
            display: block;
            font-weight: 600;
            color: var(--steam-text);
            margin-bottom: 0.65rem;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
        }

        .url-input {
            width: 100%;
            background: rgba(23, 26, 33, 0.8);
            border: 1px solid var(--steam-border);
            border-radius: 6px;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            color: var(--steam-text);
            font-family: inherit;
            transition: all 0.2s ease;
            outline: none;
            margin-bottom: 0.85rem;
        }

        .url-input::placeholder {
            color: var(--steam-text-dark);
        }

        .url-input:focus {
            border-color: var(--steam-highlight);
            box-shadow: 0 0 0 3px var(--glow-blue);
        }

        /* Buttons */
        .btn-modern {
            border-radius: 4px;
            padding: 0.55rem 1.1rem;
            font-weight: 600;
            font-family: inherit;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.88rem;
            letter-spacing: 0.3px;
        }

        .btn-modern:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-shorten {
            background: linear-gradient(135deg, var(--steam-accent) 0%, var(--steam-highlight) 100%);
            color: #0e1419;
            font-weight: 700;
            padding: 0.65rem 1.75rem;
            font-size: 0.95rem;
        }

        .btn-shorten:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px var(--glow-blue);
        }

        .btn-primary-modern {
            background: var(--steam-light-blue);
            color: var(--steam-text);
            border: 1px solid var(--steam-border);
        }

        .btn-primary-modern:hover:not(:disabled) {
            background: var(--steam-hover);
            color: white;
            transform: translateY(-1px);
        }

        .btn-secondary-modern {
            background: rgba(61, 68, 80, 0.6);
            color: var(--steam-text-dark);
            border: 1px solid var(--steam-border);
        }

        .btn-secondary-modern:hover:not(:disabled) {
            background: rgba(61, 68, 80, 0.9);
            color: var(--steam-text);
            transform: translateY(-1px);
        }

        .btn-info-modern {
            background: transparent;
            color: var(--steam-accent);
            border: 1px solid var(--steam-accent);
        }

        .btn-info-modern:hover:not(:disabled) {
            background: var(--steam-accent);
            color: var(--steam-darkest);
            transform: translateY(-1px);
        }

        /* Spinner */
        .spinner-border {
            display: inline-block;
            width: 0.85rem;
            height: 0.85rem;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spin 0.65s linear infinite;
            vertical-align: -0.1em;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Result area */
        .result-container {
            background: rgba(23, 26, 33, 0.5);
            border: 1px dashed var(--steam-border);
            border-radius: 6px;
            padding: 1rem 1.25rem;
            margin-top: 1.25rem;
            min-height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result-container:empty::before {
            content: 'Your shortened URL will appear here';
            color: var(--steam-text-dark);
            font-style: italic;
            font-size: 0.9rem;
        }

        .result-container a {
            color: var(--steam-highlight);
            font-weight: 600;
            text-decoration: none;
            word-break: break-all;
            font-size: 1rem;
            text-shadow: 0 0 8px var(--glow-blue);
        }

        .result-container a:hover {
            color: white;
        }

        /* Divider */
        .divider {
            height: 1px;
            background: var(--steam-border);
            margin: 1.75rem 0;
        }

        /* Layout helpers */
        .section-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 0.85rem;
        }

        .button-group {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .button-group-center {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        @media (max-width: 576px) {
            .main-card { padding: 1.25rem; }
            .page-header h1 { font-size: 1.75rem; }
            .section-actions { flex-direction: column; width: 100%; }
            .button-group { width: 100%; justify-content: center; }
            .btn-shorten { width: 100%; justify-content: center; }
            .steam-nav { gap: 16px; }
        }
    </style>
</head>

<body>
    <div class="page-wrapper">
        <div class="main-container">
            <div class="page-header">
                <h1><i class="bi bi-link-45deg"></i> URL Shortener</h1>
                <p>Transform long URLs into short, shareable links</p>
            </div>
            <main>
                <div class="main-card">
                    <label for="url" class="form-label">Enter your URL</label>
                    <input type="url" class="url-input" id="url" name="url" placeholder="https://example.com/your-very-long-url">

                    <div class="section-actions">
                        <div class="button-group">
                            <button type="button" class="btn-modern btn-primary-modern" onclick="getToken()" id="btnGetToken">
                                <span class="spinner-border" role="status" aria-hidden="true" style="display:none"></span>
                                <i class="bi bi-shield-lock"></i>
                                Get Token
                            </button>
                            <button type="button" class="btn-modern btn-secondary-modern" onclick="clearToken()" id="btnClearToken">
                                <span class="spinner-border" role="status" aria-hidden="true" style="display:none"></span>
                                <i class="bi bi-x-circle"></i>
                                Clear Token
                            </button>
                        </div>
                        <button type="button" class="btn-modern btn-shorten" onclick="submitUrl()" id="btnShorten">
                            <span class="spinner-border" role="status" aria-hidden="true" style="display:none"></span>
                            <i class="bi bi-scissors"></i>
                            Shorten URL
                        </button>
                    </div>

                    <div id="urlResult" class="result-container"></div>

                    <div class="divider"></div>

                    <div class="button-group-center">
                        <button type="button" class="btn-modern btn-info-modern" onclick="showReadme()">
                            <i class="bi bi-info-circle"></i>
                            About
                        </button>
                        <button type="button" class="btn-modern btn-info-modern" onclick="randomFacts()" id="btnRandomFacts">
                            <span class="spinner-border" role="status" aria-hidden="true" style="display:none"></span>
                            <i class="bi bi-lightbulb"></i>
                            Random Facts
                        </button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const Alert = Swal.mixin({
            background: 'rgba(23, 26, 33, 0.97)',
            color: '#c7d5e0',
        });

        const showLoading = (controlId) => {
            const button = document.getElementById(controlId);
            const spinner = button.querySelector('.spinner-border');
            spinner.style.display = 'inline-block';
            button.disabled = true;
        }

        const hideLoading = (controlId) => {
            const button = document.getElementById(controlId);
            const spinner = button.querySelector('.spinner-border');
            spinner.style.display = 'none';
            button.disabled = false;
        }

        document
            .getElementById('url')
            .addEventListener('keyup', function (event) {
                if (event.code === 'Enter') {
                    event.preventDefault();
                    submitUrl();
                }
            });

        const submitUrl = () => {
            showLoading('btnShorten')

            fetch('/url', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json;charset=UTF-8' },
                body: JSON.stringify(document.getElementById('url').value)
            })
                .then(response => {
                    hideLoading('btnShorten')
                    if (!response.ok) {
                        if (response.status == 401) {
                            throw new Error('Unauthorized! click the get token button first to save your jwt token <br> (this is only for showcasing i know how to secure web apps!!)');
                        } else if (response.status === 400) {
                            throw new Error('Url is invalid');
                        } else {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                    }
                    return response.json();
                })
                .then(data => {
                    const url = data.url;
                    const section = document.getElementById('urlResult');
                    section.innerHTML = `<a id="link" href="${url}">${url}</a>`;
                })
                .catch(error => {
                    Alert.fire({ icon: 'error', html: error.message });
                });
        }

        const showReadme = () => {
            Alert.fire({
                title: 'Trivia!',
                html:
                    ' * built with .NET 8 Minimal Api <br> ' +
                    ' * hosted in Azure <br> ' +
                    ' * config managed in azure key vault <br>' +
                    ' * uses postgreSQL for db <br>' +
                    ' * CI/CD with github actions<br>' +
                    ' * Jwt Authentication for the Shorten endpoint(sliding token & http only cookie)',
                icon: 'info',
            });
        }

        const getToken = () => {
            showLoading('btnGetToken')

            fetch('/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json;charset=UTF-8' }
            })
                .then(response => {
                    hideLoading('btnGetToken')
                    if (!response.ok) throw new Error(response);
                    return response;
                })
                .then(() => {
                    Alert.fire({
                        title: 'Token generated!',
                        html: 'Your token will be valid for 15 minutes, and will auto refresh if you trigger any authorization calls within 7 days',
                        icon: 'success'
                    });
                })
                .catch(error => {
                    Alert.fire({ icon: 'error', text: error.message });
                });
        }

        const clearToken = () => {
            showLoading('btnClearToken')

            fetch('/cleartoken', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json;charset=UTF-8' }
            })
                .then(response => {
                    hideLoading('btnClearToken')
                    if (!response.ok) throw new Error(response);
                    return response;
                })
                .then(() => {
                    Alert.fire({
                        title: 'Token cleared!',
                        html: 'Please re-generate the token to shorten any URL',
                        icon: 'success'
                    });
                })
                .catch(error => {
                    Alert.fire({ icon: 'error', text: error.message });
                });
        }

        const randomFacts = () => {
            showLoading('btnRandomFacts')

            fetch("https://uselessfacts.jsph.pl/api/v2/facts/random")
                .then(response => {
                    hideLoading('btnRandomFacts')
                    if (!response.ok) throw new Error(response);
                    return response.json();
                })
                .then(data => {
                    Alert.fire({
                        title: 'Random useless fact!',
                        text: data.text,
                        icon: 'info'
                    });
                })
                .catch(error => {
                    Alert.fire({ icon: 'error', text: error.message });
                });
        }
    </script>
</body>
</html>
